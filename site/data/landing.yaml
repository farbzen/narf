hero:
  enable: true
  weight: 10
  template: hero

  titleLogo:
    path: "images"
    filename: "logo.png"
    alt: "NARF logo"
    height: 80px

  title: "NARF"
  subtitle: "**NixOS Advanced Rebuild Flake**: rebuild a NixOS configuration flake and record every rebuild as a git commit."

  ctaButton:
    icon: rocket_launch
    btnText: "Get Started"
    url: "/docs/installation/"
  cta2Button:
    icon: code
    btnText: "GitHub"
    url: "https://github.com/farbzen/narf"

  info: "**Open Source**, MIT licensed."

featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: "Features"
  subtitle: "One command updates, rebuilds, commits and pushes the flake."

  items:
    - title: Rebuild as commit
      icon: commit
      description: Every new generation is committed with host, generation number, NixOS and kernel version in the message, optionally with a comment.

    - title: Input updates
      icon: update
      description: Update all flake inputs or selected ones before rebuilding.

    - title: Git sync
      icon: sync
      description: Pull before and push after the rebuild, with unpushed rebuild commits squashed into one.

    - title: Safe modes
      icon: shield
      description: Dry run, build without switching and pushing existing commits without rebuilding.

    - title: Scriptable
      icon: terminal
      description: Answer all prompts with yes and show a trace of failing rebuilds.

    - title: TUI
      icon: dashboard
      description: Pick options in a form, see the repository state and run NARF in an embedded terminal.
