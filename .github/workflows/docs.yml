name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - book.toml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - uses: actions/configure-pages@v6.0.0

      - name: Build book
        run: devenv shell -- mdbook build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
